name: BLE Release Gate HW

on:
  workflow_dispatch:
    inputs:
      port:
        description: "Serial port used by CatSniffer bridge"
        required: true
        default: "/dev/ttyACM0"
        type: string
      baudrate:
        description: "UART baudrate"
        required: true
        default: "921600"
        type: string
      phy:
        description: "PHY number (BLE 1M = 0)"
        required: true
        default: "0"
        type: string
      channel:
        description: "BLE channel (37/38/39)"
        required: true
        default: "37"
        type: string
      power:
        description: "TX power in dBm"
        required: true
        default: "0"
        type: string
      soak_duration:
        description: "Canary soak duration in seconds"
        required: true
        default: "60"
        type: string
      report_every:
        description: "Canary report interval in seconds"
        required: true
        default: "15"
        type: string
      stats_timeout:
        description: "Canary GET_STATS timeout in seconds"
        required: true
        default: "2"
        type: string
      stats_retries:
        description: "Canary GET_STATS retries"
        required: true
        default: "3"
        type: string
      profile:
        description: "Canary packet floor profile"
        required: true
        default: "ci_manual"
        type: choice
        options:
          - ci_manual
          - lab
          - quiet
      smoke_attempts:
        description: "Smoke retries inside release gate"
        required: true
        default: "3"
        type: string
      canary_attempts:
        description: "Canary retries inside release gate"
        required: true
        default: "2"
        type: string
      retry_delay:
        description: "Delay between retries (seconds)"
        required: true
        default: "2"
        type: string

permissions:
  contents: read

jobs:
  ble-release-gate:
    name: BLE Release Gate (hardware)
    runs-on:
      - self-hosted
      - feralrf-hw
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ./python

      - name: Run BLE release gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          PYTHONPATH=python python3 python/examples/release_gate_ble.py \
            -p "${{ inputs.port }}" \
            --baudrate "${{ inputs.baudrate }}" \
            --phy "${{ inputs.phy }}" \
            --channel "${{ inputs.channel }}" \
            --power "${{ inputs.power }}" \
            --soak-duration "${{ inputs.soak_duration }}" \
            --report-every "${{ inputs.report_every }}" \
            --stats-timeout "${{ inputs.stats_timeout }}" \
            --stats-retries "${{ inputs.stats_retries }}" \
            --profile "${{ inputs.profile }}" \
            --smoke-attempts "${{ inputs.smoke_attempts }}" \
            --canary-attempts "${{ inputs.canary_attempts }}" \
            --retry-delay "${{ inputs.retry_delay }}" \
            | tee artifacts/ble_release_gate.log

      - name: Upload gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ble-release-gate-log-${{ github.run_id }}
          path: artifacts/ble_release_gate.log
