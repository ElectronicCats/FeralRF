name: Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # Python package build and test
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        working-directory: python
        run: |
          pytest --cov=feralrf --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          files: python/coverage.xml

  # Firmware build (requires SDK)
  firmware:
    runs-on: ubuntu-latest
    continue-on-error: true  # SDK may not be available

    steps:
      - uses: actions/checkout@v4

      - name: Install ARM GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi cmake ninja-build

      - name: Cache Pico SDK
        uses: actions/cache@v4
        with:
          path: firmware/sdk/pico-sdk
          key: pico-sdk-2.0.0

      - name: Download Pico SDK
        run: |
          if [ ! -d "firmware/sdk/pico-sdk" ]; then
            git clone --depth 1 --branch 2.0.0 https://github.com/raspberrypi/pico-sdk.git firmware/sdk/pico-sdk
            cd firmware/sdk/pico-sdk && git submodule update --init
          fi

      - name: Build RP2040 firmware
        working-directory: firmware/rp2040
        run: |
          mkdir -p build && cd build
          cmake .. -DPICO_SDK_PATH=../../sdk/pico-sdk
          make -j$(nproc) || echo "RP2040 build requires SDK setup"

      # Note: CC1352 build requires TI SDK which must be downloaded manually
      - name: Check CC1352 SDK
        run: |
          if [ ! -d "firmware/sdk/simplelink_cc13xx_cc26xx_sdk_7_10_01_24" ]; then
            echo "TI SDK not available - CC1352 build skipped"
            echo "Download from: https://www.ti.com/tool/download/SIMPLELINK-CC13XX-CC26XX-SDK"
          fi

  # Lint and format check
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linters
        run: |
          pip install black isort mypy flake8

      - name: Check formatting
        working-directory: python
        run: |
          black --check feralrf tests examples
          isort --check-only feralrf tests examples

      - name: Type check
        working-directory: python
        run: |
          mypy feralrf --ignore-missing-imports || true

      - name: Lint
        working-directory: python
        run: |
          flake8 feralrf tests examples --max-line-length=100 --ignore=E501,W503
