name: Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # Python package build and test
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        working-directory: python
        run: |
          pytest --cov=feralrf --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          files: python/coverage.xml

  # CC1352 firmware build (best-effort; full TI installer libs are not available in CI)
  firmware:
    runs-on: ubuntu-latest
    continue-on-error: true  # TI full-installer libs (drivers/driverlib/sysbios) may be missing

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ARM GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi cmake ninja-build

      - name: Configure CC1352 build
        working-directory: firmware/cc1352
        run: |
          mkdir -p build && cd build
          cmake .. || echo "CC1352 build requires the TI full-installer libs (SDK 8.30.01.01)"

  # Lint and format check
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linters
        run: |
          pip install black isort mypy flake8

      - name: Check formatting
        working-directory: python
        run: |
          black --check feralrf tests examples
          isort --check-only feralrf tests examples

      - name: Type check
        working-directory: python
        run: |
          mypy feralrf --ignore-missing-imports || true

      - name: Lint
        working-directory: python
        run: |
          flake8 feralrf tests examples --max-line-length=100 --ignore=E501,W503
